# LL Brown public repository: update GitHub Actions when workflows are added.
# There are currently no package manifests or workflows on the main branch.
# Keep dependency PRs review-only; do not enable automatic merge/deployment.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Indiana/Indianapolis"
    open-pull-requests-limit: 3
